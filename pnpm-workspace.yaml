packages:
  - "apps/*"
  - "packages/*"

# Postinstall build scripts explicitly allowed (pnpm 12 blocks them by default).
allowBuilds:
  esbuild: true
  workerd: true

# pnpm 12 grafted these on install (packages younger than the release-age quarantine).
minimumReleaseAgeExclude:
  - "@cloudflare/workers-types@5.20261021.1"
  - framer-motion@14.5.0
  - motion-dom@14.5.0
  - vite@8.3.5
